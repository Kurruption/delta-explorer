[package]
name = "de-shell"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.18"
trash = "5"
windows-collections = "0.3" # IIterable from a Vec, for the Share sheet
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation_Collections", "Storage", "Storage_Search", "Storage_Streams", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WinRT", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
