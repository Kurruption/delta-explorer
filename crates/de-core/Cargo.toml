[package]
name = "de-core"
version.workspace = true
edition.workspace = true

[dependencies]
bzip2 = "0.6.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
kamadak-exif = "0.6.2"
lofty = "0.25.5"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
md-5 = "0.11.0"
regex = "1" # batch rename patterns
serde = { version = "1", features = ["derive"] }
sevenz-rust2 = "0.25.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
similar = "3.2.1"
tar = "0.4.46"
unrar = "0.5.8"
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs", "deflate64"] } # pure Rust; no C toolchains

[dev-dependencies]
serde_json = "1"
